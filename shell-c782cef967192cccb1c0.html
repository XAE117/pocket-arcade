<style>
:root{color-scheme:light;font:16px/1.5 Atkinson Hyperlegible Next,system-ui,-apple-system,sans-serif;--navy:#142238;--deep:#0c182e;--ink:#172837;--cream:#faf1dc;--cream-dark:#e9dbb7;--teal:#165f62;--gold:#f0c06c}
*,*::before,*::after{box-sizing:border-box}
html{background:#101d32;touch-action:manipulation}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(ellipse at 15% 22%,#234659 0%,#182c43 37%,#101d32 71%)}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
main{width:min(100%,990px);display:grid;grid-template-columns:1.16fr 1fr;min-width:0;border:1px solid #bfc2a076;border-radius:18px;box-shadow:0 26px 70px #070e1c8c;overflow:hidden;background:var(--cream);isolation:isolate}
.brand-field{min-height:410px;display:grid;place-items:center;position:relative;overflow:hidden;background:#12223d}
.brand-field::after{content:"";position:absolute;inset:9px;border:1px solid #dfc68863;border-radius:9px;pointer-events:none}
.brand-water{width:100%;height:100%;position:absolute;inset:0;opacity:.93}
.brand-lockup{position:relative;display:flex;align-items:center;flex-direction:column;width:92%;padding:25px 13px 41px}
.brand-emblem{width:clamp(72px,11.4vw,117px);height:auto;margin-bottom:12px;filter:drop-shadow(0 12px 9px #091a2ab3);border-radius:20%}
.brand-name{width:min(100%,550px);line-height:0;filter:drop-shadow(0 12px 11px #101b2bce)}
.brand-name svg{display:block;width:100%;height:auto;overflow:visible}
.panel{padding:34px clamp(23px,4.1vw,58px);min-width:0;display:grid;align-content:center;gap:16px;color:var(--ink);background:radial-gradient(ellipse at 90% 15%,#fff9ec,#f5ead0 74%);border-left:1px solid #e0ce9d}
.panel-head{min-width:0}
.family-tag{display:inline-flex;gap:7px;align-items:center;width:max-content;max-width:100%;font-size:.74rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#1d6366}
.family-tag::before{content:"";width:7px;height:7px;flex:none;transform:rotate(45deg);background:#c1883a;border-radius:1px}
#status{font-size:clamp(26px,3.6vw,43px);line-height:.99;font-weight:850;letter-spacing:-.04em;margin:11px 0 0;text-wrap:balance}
#hint{margin:9px 0 0;color:#3f514c;font-size:.97rem;line-height:1.4}
#unlock{display:grid;gap:7px;min-width:0}
label,.meter-copy{font-size:.83rem;font-weight:750;color:#355252}
input,button{font:inherit;border-radius:7px;min-height:46px}
input{min-width:0;width:100%;padding:8px 10px;border:1px solid #69847c;background:#fffaf0;color:#18313c}
input::placeholder{color:#586761}
button{appearance:none;justify-self:start;border:1px solid #1a5256;padding:8px 19px;display:inline-flex;align-items:center;gap:12px;background:#146367;color:#fff9df;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #0b4549;line-height:1.2}
button:hover{background:#0d565b}
#check-update{background:transparent;color:#254a53;border-color:#788781;box-shadow:none;font-size:.88rem;min-height:44px}
#play{background:#f3c875;color:#202b3b;border-color:#8b5d34;box-shadow:0 3px 0 #84572e}
#play:hover{background:#ffda89}
#play::after{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:8px solid currentColor}
:focus-visible{outline:3px solid #20676e;outline-offset:3px}
.meter{display:grid;gap:7px}
.meter-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meter-value{color:#354848;font-weight:760;font-variant-numeric:tabular-nums;font-size:.83rem;text-align:right}
progress{width:100%;height:8px;appearance:none;border:0;border-radius:12px;overflow:hidden;background:#e1d5b7;color:#14656a}
progress::-webkit-progress-bar{background:#e5d7b7;border-radius:12px}
progress::-webkit-progress-value{background:linear-gradient(90deg,#167577,#3e9286);border-radius:12px}
progress::-moz-progress-bar{background:#1b7675;border-radius:12px}
[data-phase="error"] .family-tag{color:#843d32}
[data-phase="error"] .family-tag::before{background:#b9553a}
[data-phase="offline"] .family-tag::before{background:#24726d}
@media(max-width:630px){
  body{padding:max(9px,env(safe-area-inset-top)) max(9px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left))}
  main{max-width:415px;grid-template-columns:1fr;border-radius:12px}
  .brand-field{min-height:0}
  .brand-field::after{inset:6px}
  .brand-emblem{width:clamp(57px,17vw,77px);margin-bottom:7px}
  .brand-lockup{padding:13px 12px 22px;width:min(100%,347px)}
  .panel{border-left:0;border-top:1px solid #e0ce9d;padding:20px 21px;gap:13px}
  #status{font-size:clamp(27px,7.2vw,34px)}
  #hint{font-size:.91rem}
}
@media(max-height:520px) and (min-width:631px){
  .brand-field{min-height:225px}
  .brand-lockup{padding:13px 12px 25px}
  .brand-emblem{width:61px;margin-bottom:6px}
  .panel{padding:16px 23px;gap:10px}
  #status{font-size:clamp(26px,4vw,38px)}
}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .14s ease-out}}
.arcade-transfer-dialog{width:min(25rem,92vw);padding:20px;border:2px solid #ad945c;border-radius:16px;background:#fff5dd;color:#183144;font:600 1rem system-ui}
.arcade-transfer-dialog::backdrop{background:#102238bd}
.arcade-transfer-title{font-size:1.4rem;margin:0 0 .6rem}
.arcade-transfer-message{margin:.6rem 0 1rem}
.arcade-transfer-meter{display:block;width:100%;margin:0 0 1rem}
.arcade-transfer-actions{display:flex;gap:10px}

.brand-field{background:#24264b;isolation:isolate;min-height:440px;align-items:end}
.launch-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}

.brand-field::after{border:1px solid #ffdc9361;z-index:3;border-radius:5px}
.brand-lockup{align-self:end;align-items:flex-start;justify-self:start;width:min(80%,365px);padding:0 0 12px 16px;z-index:2}
.brand-name{filter:drop-shadow(0 4px 2px #100e25a8)}
@media(max-width:630px){.brand-field{min-height:clamp(190px,38svh,280px)}.launch-poster{object-position:50% 34%}.brand-lockup{width:min(67%,265px);padding:0 0 6px 7px}.panel{padding-top:17px}}

  <section class="panel" aria-labelledby="status">
    <div class="panel-head">
      <span class="family-tag" id="phase-label">Family arcade</span>
      <h2 id="status" role="status">Opening the arcade…</h2>
      <p id="hint" hidden></p>
    </div>
    <div id="transfer" class="meter" hidden>
      <div class="meter-row"><label for="progress">Game download</label><span id="transfer-detail" class="meter-value" aria-hidden="true"></span></div>
      <progress id="progress" value="0" max="1"></progress>
    </div>
    <form id="unlock" novalidate hidden>
      <label for="invite">Family password</label>
      <input id="invite" type="password" placeholder="Family password" aria-describedby="hint" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" required>
      <button type="submit">Unlock game</button>
    </form>
    <button id="retry" type="button" hidden>Retry download</button>
    <button id="play" type="button" hidden>Play</button>
    <button id="save-offline" type="button" hidden>Save full game for offline play</button>
    <button id="check-update" type="button">Check for updates</button>
    <noscript>Enable JavaScript in Safari to open your invitation.</noscript>
  </section>
